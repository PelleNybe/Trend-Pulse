name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate typed configuration
        run: |
          python generate_config.py

      - name: Compile-check Python sources
        run: |
          python -m compileall -q app.py generate_config.py InsightEngine MediaEngine QueryEngine ReportEngine ForumEngine MindSpider utils tests

      - name: Check JS syntax across templates and static assets
        run: |
          python -c "
          import glob, os, re, subprocess, tempfile
          files = sorted(glob.glob('templates/*.html') + glob.glob('static/js/*.js'))
          for f in files:
              if f.endswith('.js'):
                  subprocess.run(['node', '--check', f], check=True)
              else:
                  txt = open(f, encoding='utf-8').read()
                  for sc in re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', txt, re.S):
                      with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as tf:
                          tf.write(sc)
                          p = tf.name
                      try:
                          subprocess.run(['node', '--check', p], check=True)
                      finally:
                          os.unlink(p)
          "

      - name: Run pytest suite
        env:
          SECRET_KEY: ci-test-secret-key
        run: |
          pytest -v tests/ ReportEngine/utils/test_chart_validator.py ReportEngine/utils/test_json_parser.py

      - name: Run standalone ForumEngine monitor runner
        run: |
          python tests/run_tests.py
