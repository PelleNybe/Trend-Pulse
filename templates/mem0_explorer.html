<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Pulse - Nexus Memory Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--neon-blue, #00f0ff);
            outline-offset: 2px;
        }
        :root {
            --bg-base: #030308;
            --neon-blue: #0df2f2;
            --neon-magenta: #f20dcf;
            --neon-green: #33f20d;
            --text-primary: #ffffff;
            --text-muted: #666688;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(13, 242, 242, 0.05) 0%, transparent 60%);
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(13, 242, 242, 0.2);
            z-index: 10;
            background: rgba(3,3,8,0.8);
            backdrop-filter: blur(5px);
        }

        h1 {
            color: var(--text-primary);
            font-size: 1.8rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            margin: 0 2rem;
            position: relative;
        }

        .search-container input {
            width: 100%;
            background: rgba(13, 242, 242, 0.05);
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .search-container input:focus {
            box-shadow: 0 0 15px rgba(13, 242, 242, 0.3);
        }

        .nav-return {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-return:hover { color: var(--neon-blue); }

        /* Accessibility: Screen-reader only class */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        #graph-container {
            flex: 1;
            position: relative;
            cursor: grab;
        }
        #graph-container:active { cursor: grabbing; }

        /* Bottom Sheet */
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid var(--neon-blue);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            padding: 2rem;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            z-index: 20;
        }

        .bottom-sheet.active {
            bottom: 0;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(13, 242, 242, 0.2);
            padding-bottom: 1rem;
        }

        .sheet-title {
            color: var(--neon-blue);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .node-type-badge {
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }

        .close-sheet {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .rag-snippet {
            background: #000;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 3px solid var(--neon-magenta);
            font-family: monospace;
            color: #ccc;
            line-height: 1.5;
            height: 150px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .btn-feed {
            background: rgba(13, 242, 242, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 0.8rem 2rem;
            font-size: 1rem;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            float: right;
        }

        .btn-feed:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* SVG Graph Styles */
        .node circle {
            stroke: #fff;
            stroke-width: 1.5px;
            transition: all 0.2s;
        }
        .node:hover circle {
            stroke-width: 3px;
        }
        .node text {
            font-size: 12px;
            fill: #fff;
            text-shadow: 0 1px 3px #000;
            pointer-events: none;
        }
        .link {
            stroke: rgba(13, 242, 242, 0.3);
            stroke-opacity: 0.6;
        }
    </style>
</head>
<body>

    <header>
        <h1><span style="color:var(--neon-blue)">⌘</span> Nexus Memory</h1>
        <div class="search-container">
            <label for="searchInput" class="sr-only">Search Nexus Memory</label>
            <input type="text" id="searchInput" placeholder="Search Nexus Memory..." aria-label="Search Nexus Memory" autocomplete="off">
        </div>
        <a href="/" class="nav-return">&larr; Return</a>
    </header>

    <div id="graph-container" aria-live="polite" aria-busy="true"></div>

    <!-- RAG Context Bottom Sheet -->
    <div class="bottom-sheet" id="context-sheet">
        <div class="sheet-header">
            <h2 class="sheet-title">
                <span id="sheet-title-text">Node Title</span>
                <span class="node-type-badge" id="sheet-type">Historical Data</span>
            </h2>
            <button class="close-sheet" data-action="closeSheet" aria-label="Close sheet">×</button>
        </div>
        <div style="color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; font-size: 0.8rem;">RAG Context Snippet</div>
        <div class="rag-snippet" id="rag-content" aria-live="polite" aria-atomic="true">
            // Context loaded from vector database...
        </div>
        <button class="btn-feed" data-action="feedToAgents" aria-label="Feed memory to Agents">Feed to Agents</button>
    </div>

    <script>
        let svg = null;
        let g = null;
        let simulation = null;
        let link = null;
        let node = null;
        let currentMemoryData = null;

        // Fetch memories and render graph
        fetch('/api/mem0/memories')
            .then(res => res.json())
            .then(data => {
                let graphData = { nodes: [], links: [] };

                if (Array.isArray(data.nodes) && data.nodes.length > 0) {
                    graphData.nodes = data.nodes.map(n => ({
                        id: n.id,
                        group: n.group ?? 0,
                        radius: n.radius || 14,
                        content: n.content || n.id
                    }));
                    graphData.links = Array.isArray(data.links) ? data.links : [];
                } else if (data.success && Array.isArray(data.memories) && data.memories.length > 0) {
                    graphData.nodes.push({ id: "Core Market Thesis", group: 0, radius: 25, content: "Unified market synthesis combining macro context with agent observations." });

                    data.memories.forEach((mem, index) => {
                        const group = 1 + (index % 4);
                        const id = mem.id || `Memory-${index + 1}`;
                        const contentStr = mem.memory || mem.text || JSON.stringify(mem);
                        graphData.nodes.push({
                            id: id,
                            group: group,
                            radius: 14,
                            content: contentStr
                        });
                        graphData.links.push({
                            source: "Core Market Thesis",
                            target: id,
                            value: 2
                        });
                    });
                } else {
                    graphData = {
                        nodes: [
                            { id: "Core Market Thesis", group: 0, radius: 25, content: "System memory graph initialized. Run agents to add new memories." }
                        ],
                        links: []
                    };
                }

                renderGraph(graphData);
            })
            .catch(err => console.error("Error fetching Mem0 data:", err));

        function renderGraph(graphData) {
            const colorMap = {
                0: "#ffffff", // Core
                1: "var(--neon-cyan)", // History
                2: "var(--neon-magenta)", // Sentiment
                3: "var(--neon-amber)", // Regs
                4: "var(--neon-green)" // Macro
            };

            const typeMap = {
                0: "Root", 1: "Historical", 2: "Sentiment", 3: "Regulatory", 4: "Macroeconomic"
            };
            window.__mem0ColorMap = colorMap;
            window.__mem0TypeMap = typeMap;

            const container = document.getElementById('graph-container');
            const width = container.clientWidth || 800;
            const height = container.clientHeight || 600;
            container.setAttribute('aria-busy', 'false');

            svg = d3.select("#graph-container").append("svg")
                .attr("width", width)
                .attr("height", height)
                .call(d3.zoom().on("zoom", (event) => {
                    g.attr("transform", event.transform);
                }));

            g = svg.append("g");

            simulation = d3.forceSimulation(graphData.nodes)
                .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(120))
                .force("charge", d3.forceManyBody().strength(-400))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(d => d.radius + 10).iterations(2));

            link = g.append("g")
                .selectAll("line")
                .data(graphData.links)
                .join("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value || 1));

            node = g.append("g")
                .selectAll("g")
                .data(graphData.nodes)
                .join("g")
                .attr("class", "node")
                .call(drag(simulation))
                .on("click", (event, d) => openSheet(d));

            node.append("circle")
                .attr("r", d => d.radius)
                .attr("fill", d => colorMap[d.group] || "var(--neon-cyan)")
                .style("filter", d => `drop-shadow(0 0 8px ${colorMap[d.group] || "var(--neon-cyan)"})`);

            node.append("text")
                .text(d => d.id)
                .attr("x", d => d.radius + 5)
                .attr("y", 3);

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        // Drag functionality
        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }
            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }
            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        // Search Functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            if (!node || !link) return;
            const term = e.target.value.toLowerCase();
            if(!term) {
                node.select("circle").style("opacity", 1).attr("r", d => d.radius);
                link.style("opacity", 0.6);
                return;
            }

            node.select("circle")
                .style("opacity", d => d.id.toLowerCase().includes(term) || (d.content || '').toLowerCase().includes(term) ? 1 : 0.2)
                .attr("r", d => d.id.toLowerCase().includes(term) || (d.content || '').toLowerCase().includes(term) ? d.radius * 1.5 : d.radius);

            link.style("opacity", 0.1);
        });

        // Bottom Sheet Logic
        const sheet = document.getElementById('context-sheet');

        function openSheet(data) {
            currentMemoryData = data;
            const colorMap = window.__mem0ColorMap || { 0: "#ffffff", 1: "var(--neon-cyan)" };
            const typeMap = window.__mem0TypeMap || { 0: "Root", 1: "Memory" };
            document.getElementById('sheet-title-text').textContent = data.id;
            document.getElementById('sheet-type').textContent = typeMap[data.group] || "Memory";
            document.getElementById('sheet-type').style.color = colorMap[data.group] || "var(--neon-cyan)";

            const content = document.getElementById('rag-content');
            content.style.borderLeftColor = colorMap[data.group] || "var(--neon-cyan)";
            content.textContent = JSON.stringify({
                id: data.id,
                source: `${typeMap[data.group] || "Memory"} Context`,
                payload: data.content || data.id,
                timestamp: new Date().toISOString()
            }, null, 2);

            sheet.classList.add('active');
        }

        function closeSheet() {
            sheet.classList.remove('active');
        }

        async function feedToAgents() {
            const btn = document.querySelector('.btn-feed');
            if (!currentMemoryData) {
                closeSheet();
                return;
            }
            const typeMap = window.__mem0TypeMap || { 0: "Root", 1: "Memory" };
            btn.disabled = true;
            btn.setAttribute('aria-disabled', 'true');
            btn.textContent = 'Injecting...';
            try {
                const res = await fetch('/api/mem0/feed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: currentMemoryData.content || currentMemoryData.id,
                        source: typeMap[currentMemoryData.group] || 'Mem0 Explorer'
                    })
                });
                const payload = await res.json();
                btn.textContent = payload.success ? 'Injected' : 'Injection Failed';
                btn.style.background = payload.success ? 'var(--neon-green)' : 'var(--neon-magenta)';
                btn.style.color = '#000';
                setTimeout(() => {
                    btn.textContent = 'Feed to Agents';
                    btn.style.background = '';
                    btn.style.color = '';
                    btn.disabled = false;
                    btn.setAttribute('aria-disabled', 'false');
                    if (payload.success) closeSheet();
                }, 900);
            } catch (err) {
                btn.textContent = 'Error Injecting';
                btn.disabled = false;
                btn.setAttribute('aria-disabled', 'false');
            }
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            if (!svg || !simulation) return;
            const container = document.getElementById('graph-container');
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            svg.attr("width", newWidth).attr("height", newHeight);
            simulation.force("center", d3.forceCenter(newWidth / 2, newHeight / 2));
            simulation.alpha(0.3).restart();
        });

    </script>
<script>
        // Event delegation for actions
        document.addEventListener('click', function(e) {
            const target = e.target.closest('[data-action]');
            if (target) {
                const action = target.getAttribute('data-action');
                if (typeof window[action] === 'function') {
                    window[action]();
                }
            }
        });
</script>

</body>
