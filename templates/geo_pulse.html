<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Pulse | Trend Pulse by Corax CoLAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--neon-blue, #00f0ff);
            outline-offset: 2px;
        }
        body { margin: 0; padding: 0; background-color: #020205; color: #00f0ff; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .overlay { position: absolute; z-index: 10; padding: 20px; top: 0; left: 0; width: 100%; pointer-events: none; }
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .title { font-size: 32px; font-weight: 700; text-shadow: 0 0 15px rgba(0, 240, 255, 0.8); }
        .back-btn { pointer-events: auto; padding: 8px 16px; background: rgba(0,0,0,0.6); border: 1px solid #00f0ff; color: #00f0ff; border-radius: 4px; text-decoration: none; font-size: 14px; transition: all 0.3s; }
        .back-btn:hover { background: #00f0ff; color: #000; box-shadow: 0 0 10px #00f0ff; }
        .branding { position: absolute; bottom: 20px; right: 20px; font-size: 12px; opacity: 0.6; pointer-events: auto; text-align: right; z-index: 10;}
        .branding a { color: #00f0ff; text-decoration: none; }
        .branding a:hover { text-decoration: underline; }
        .info-panel {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            background: rgba(10, 10, 25, 0.8); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px; padding: 15px; width: 300px; backdrop-filter: blur(5px);
        }
        .info-title { font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid rgba(0, 240, 255, 0.3); padding-bottom: 5px; }
        .pulse-item { font-size: 14px; margin-bottom: 5px; display: flex; justify-content: space-between;}
        .positive { color: #00ff88; text-shadow: 0 0 5px #00ff88; }
        .negative { color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        .neutral { color: #aaaaaa; }

        /* Enhanced Geo Pulse UI */
        .info-panel {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .info-panel:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .title {
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00f0ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 0 8px rgba(0,240,255,0.6));
        }
        .back-btn {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay">
        <div class="header">
            <div class="title">Geo-Pulse: Global Sentiment Map</div>
            <a href="/" class="back-btn">RETURN TO NEXUS</a>
        </div>
    </div>

    <div class="info-panel" aria-live="polite" aria-atomic="true">
        <div class="info-title">Live Regional Sentiment</div>
        <div id="pulse-feed">
            <div class="pulse-item">Initializing Data Link...</div>
        </div>
    </div>

    <div class="branding">
        Trend Pulse by <a href="https://coraxcolab.com" target="_blank" rel="noopener noreferrer">Corax CoLAB</a><br>
        Developer: <a href="https://github.com/PelleNybe" target="_blank" rel="noopener noreferrer">Pelle</a> |
        <a href="https://buymeacoffee.com/pellenybe" target="_blank" rel="noopener noreferrer">Sponsor</a>
    </div>

    <script>
        // Setup Three.js scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 250;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Create Globe
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        const globeGeometry = new THREE.SphereGeometry(100, 64, 64);

        // Simple procedural texture for globe (wireframe + glowing sphere)
        const globeMaterial = new THREE.MeshBasicMaterial({
            color: 0x0a0a1a,
            transparent: true,
            opacity: 0.9,
            wireframe: true,
            wireframeLinewidth: 1
        });
        const globe = new THREE.Mesh(globeGeometry, globeMaterial);
        globeGroup.add(globe);

        const innerGlobeMaterial = new THREE.MeshBasicMaterial({
            color: 0x020205,
            transparent: true,
            opacity: 0.95
        });
        const innerGlobe = new THREE.Mesh(new THREE.SphereGeometry(99, 32, 32), innerGlobeMaterial);
        globeGroup.add(innerGlobe);

        // Atmosphere Glow
        const atmosMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.1,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(110, 64, 64), atmosMaterial);
        scene.add(atmosphere);

        // Markers
        let markers = [];
        const markerGeometry = new THREE.SphereGeometry(2, 16, 16);

        // Convert Lat/Lon to Vector3
        function calcPosFromLatLonRad(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        // Data Feed Simulation (WebSocket replacement for standalone demo)

        // Fetch Real Geo Pulse Data
                // Helper function for XSS protection
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function updateGeoPulse() {
            try {
                const response = await fetch('/api/geo_data');
                const geoData = await response.json();

                const feed = document.getElementById('pulse-feed');
                feed.textContent = ''; // Clear

                // Clear old markers if any
                markers.forEach(m => globeGroup.remove(m.mesh));
                markers = [];

                geoData.forEach(region => {
                    const pos = calcPosFromLatLonRad(region.lat, region.lng, 100);
                    const sentimentVal = typeof region.sentiment === 'number' ? region.sentiment : 0.5;
                    const score = (sentimentVal - 0.5) * 2;
                    const regionName = region.location || region.name || 'Market Hub';

                    // Create marker on radius-100 globe surface
                    const material = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
                    const mesh = new THREE.Mesh(markerGeometry, material);
                    mesh.position.copy(pos);
                    globeGroup.add(mesh);

                    let markerObj = { mesh, region, score, name: regionName };
                    markers.push(markerObj);

                    // Visual updates
                    if (markerObj.score > 0.15) markerObj.mesh.material.color.setHex(0x00ff88); // Positive
                    else if (markerObj.score < -0.15) markerObj.mesh.material.color.setHex(0xff0055); // Negative
                    else markerObj.mesh.material.color.setHex(0x00f0ff); // Neutral

                    const intensityVal = typeof region.intensity === 'number' ? region.intensity : Math.abs(markerObj.score);
                    const s = 1 + intensityVal * 2.5;
                    markerObj.mesh.scale.set(s, s, s);

                    // DOM Updates
                    const sentimentClass = markerObj.score > 0.15 ? 'positive' : (markerObj.score < -0.15 ? 'negative' : 'neutral');
                    const sign = markerObj.score > 0 ? '+' : '';
                    const item = document.createElement('div');
                    item.className = 'pulse-item';
                    const spanName = document.createElement("span");
                    spanName.textContent = markerObj.name;
                    const spanScore = document.createElement("span");
                    spanScore.className = sentimentClass;
                    spanScore.textContent = `${sign}${(markerObj.score * 100).toFixed(1)}%`;
                    item.textContent = "";
                    item.appendChild(spanName);
                    item.appendChild(document.createTextNode(" "));
                    item.appendChild(spanScore);
                    feed.appendChild(item);
                });
            } catch (err) {
                console.error("Failed to update geo pulse", err);
            }
        }

        // Initial fetch and set interval for real data
        updateGeoPulse();
        setInterval(updateGeoPulse, 30000); // 30s update rate to respect limits



        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            globeGroup.rotation.y += 0.002;
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
