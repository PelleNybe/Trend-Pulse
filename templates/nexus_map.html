<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Pulse - Agentic Debate Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--neon-blue, #00f0ff);
            outline-offset: 2px;
        }
        :root {
            --bg-base: #050505;
            --bg-panel: rgba(15, 15, 20, 0.85);
            --neon-green: #33f20d;
            --neon-red: #f20d33;
            --neon-blue: #0df2f2;
            --neon-amber: #f2a90d;
            --text-primary: #ffffff;
            --text-muted: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(13, 242, 242, 0.05) 0%, transparent 60%);
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(13, 242, 242, 0.2);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: var(--text-primary);
            font-size: 1.8rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-return {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-return:hover { color: var(--neon-blue); }

        .main-content {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            height: calc(100vh - 80px);
        }

        /* Chat Arena */
        .chat-container {
            flex: 2;
            background: var(--bg-panel);
            border: 1px solid rgba(13, 242, 242, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .confidence-meter {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 60%;
        }

        .meter-bar {
            flex: 1;
            height: 10px;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-amber), var(--neon-green));
            border-radius: 5px;
            position: relative;
        }

        .meter-indicator {
            position: absolute;
            top: -5px;
            width: 4px;
            height: 20px;
            background: white;
            box-shadow: 0 0 10px white;
            transition: left 0.5s ease;
            left: 50%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .message {
            max-width: 85%;
            padding: 1rem;
            border-radius: 8px;
            position: relative;
            animation: fadeIn 0.4s ease-out;
            background: rgba(0,0,0,0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-bull {
            align-self: flex-start;
            border-left: 4px solid var(--neon-green);
            box-shadow: -5px 0 15px rgba(51, 242, 13, 0.1);
        }
        .msg-bear {
            align-self: flex-end;
            border-right: 4px solid var(--neon-red);
            box-shadow: 5px 0 15px rgba(242, 13, 51, 0.1);
        }
        .msg-risk {
            align-self: center;
            border-top: 4px solid var(--neon-amber);
            box-shadow: 0 -5px 15px rgba(242, 169, 13, 0.1);
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .agent-name { font-weight: bold; text-transform: uppercase; }
        .msg-bull .agent-name { color: var(--neon-green); }
        .msg-bear .agent-name { color: var(--neon-red); }
        .msg-risk .agent-name { color: var(--neon-amber); }

        /* Thought Graph */
        .graph-container {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid rgba(13, 242, 242, 0.3);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        .graph-title {
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        #thought-graph {
            flex: 1;
            width: 100%;
        }

        .typing-indicator {
            display: none;
            padding: 1rem;
            color: var(--text-muted);
            font-style: italic;
        }

    </style>
</head>
<body>

    <header>
        <h1><span style="color:var(--neon-blue)">&#9889;</span> Agentic Debate Arena</h1>
        <a href="/" class="nav-return" aria-label="Return to Control Center" title="Return to Control Center">&larr; Control Center</a>
    </header>

    <div class="main-content">
        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <div>Topic: <span id="debate-topic" style="color:var(--neon-blue)">Multi-Agent Market Debate</span></div>
                <div class="confidence-meter">
                    <span style="color:var(--neon-red); font-size:0.8rem;">SELL</span>
                    <div class="meter-bar">
                        <div class="meter-indicator" id="meter-needle"></div>
                    </div>
                    <span style="color:var(--neon-green); font-size:0.8rem;">BUY</span>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages" aria-live="polite" aria-atomic="false">
                <!-- Messages JS injected here -->
            </div>
            <div class="typing-indicator" id="typing" aria-live="polite" aria-atomic="true">Bull Agent is analyzing data...</div>
        </div>

        <!-- Graph Area -->
        <div class="graph-container">
            <div class="graph-title">Live Thought Graph</div>
            <div id="thought-graph"></div>
        </div>
    </div>

    <script>
        // Debate Simulation Data
        let debateScript = [];
        let isFetching = false;

        async function fetchDebate() {
            if (isFetching) return;
            isFetching = true;
            try {
                const response = await fetch('/api/nexus/debate');
                const data = await response.json();
                debateScript = Array.isArray(data.debate) ? data.debate : [];
                const topicEl = document.getElementById('debate-topic');
                if (topicEl && data.topic) {
                    topicEl.textContent = data.topic;
                }
                msgIndex = 0;
            } catch (error) {
                console.error("Error fetching debate:", error);
            } finally {
                isFetching = false;
            }
        }

        const chatContainer = document.getElementById('chat-messages');
        const typingIndicator = document.getElementById('typing');
        const meterNeedle = document.getElementById('meter-needle');

        let msgIndex = 0;
        let currentScore = 50; // 0-100 (Sell-Buy)

        // D3 Graph Setup
        const width = document.getElementById('thought-graph').clientWidth;
        const height = document.getElementById('thought-graph').clientHeight || 600;
        const svg = d3.select("#thought-graph").append("svg")
            .attr("width", width)
            .attr("height", height);

        let graphNodes = [{ id: "Core Thesis", group: "core" }];
        let graphLinks = [];

        const simulation = d3.forceSimulation(graphNodes)
            .force("link", d3.forceLink(graphLinks).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));

        let link = svg.append("g").selectAll(".link");
        let node = svg.append("g").selectAll(".node");
        let text = svg.append("g").selectAll(".text");

        function updateGraph(newText, type) {
            const newNodeId = `Arg_${msgIndex}`;
            const groupType = type.replace('msg-', '');

            graphNodes.push({ id: newNodeId, text: newText.substring(0, 15) + "...", group: groupType });

            // Connect to core or previous node
            const target = msgIndex === 1 ? "Core Thesis" : `Arg_${msgIndex-1}`;
            graphLinks.push({ source: newNodeId, target: target });

            link = link.data(graphLinks);
            link.exit().remove();
            link = link.enter().append("line")
                .attr("stroke", "rgba(13, 242, 242, 0.3)")
                .attr("stroke-width", 2)
                .merge(link);

            node = node.data(graphNodes);
            node.exit().remove();
            node = node.enter().append("circle")
                .attr("r", d => d.group === 'core' ? 15 : 10)
                .attr("fill", d => {
                    if(d.group === 'bull') return "var(--neon-green)";
                    if(d.group === 'bear') return "var(--neon-red)";
                    if(d.group === 'risk') return "var(--neon-amber)";
                    return "var(--neon-blue)";
                })
                .attr("filter", "drop-shadow(0 0 5px currentColor)")
                .merge(node);

            text = text.data(graphNodes);
            text.exit().remove();
            text = text.enter().append("text")
                .text(d => d.text || d.id)
                .attr("fill", "rgba(255,255,255,0.7)")
                .attr("font-size", "10px")
                .attr("dx", 15)
                .attr("dy", 4)
                .merge(text);

            simulation.nodes(graphNodes);
            simulation.force("link").links(graphLinks);
            simulation.alpha(1).restart();
        }

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
            text
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });

        // Chat Loop
        async function nextMessage() {
            if (msgIndex >= debateScript.length) {
                // Loop simulation, fetch new data
                chatContainer.textContent = '';
                graphNodes = [{ id: "Core Thesis", group: "core" }];
                graphLinks = [];
                updateGraph("init", "core");
                currentScore = 50;
                await fetchDebate();
                if (debateScript.length === 0) return; // Prevent infinite loop if fetch fails
            }

            const msg = debateScript[msgIndex];

            typingIndicator.style.display = 'block';
            typingIndicator.innerText = `${msg.agent} is formulating argument...`;

            setTimeout(() => {
                typingIndicator.style.display = 'none';

                const div = document.createElement('div');
                div.className = `message ${msg.type}`;
                const time = new Date().toLocaleTimeString();


                const headerDiv = document.createElement("div");
                headerDiv.className = "msg-header";

                const agentSpan = document.createElement("span");
                agentSpan.className = "agent-name";
                agentSpan.textContent = msg.agent;

                const timeSpan = document.createElement("span");
                timeSpan.textContent = time;

                headerDiv.appendChild(agentSpan);
                headerDiv.appendChild(timeSpan);

                const bodyDiv = document.createElement("div");
                bodyDiv.className = "msg-body";
                bodyDiv.textContent = msg.text;

                div.appendChild(headerDiv);
                div.appendChild(bodyDiv);


                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // Update Meter
                if(msg.type === 'msg-bull') currentScore = Math.min(95, currentScore + 15);
                if(msg.type === 'msg-bear') currentScore = Math.max(5, currentScore - 15);
                if(msg.type === 'msg-risk') currentScore = currentScore > 50 ? currentScore - 5 : currentScore + 5;
                meterNeedle.style.left = `${currentScore}%`;

                // Update Graph
                updateGraph(msg.text, msg.type);

                msgIndex++;
                setTimeout(nextMessage, 1800);
            }, 1500);
        }

        // Start
        fetchDebate().then(() => setTimeout(nextMessage, 1000));

    </script>
    <div style="position: fixed; bottom: 6px; left: 10px; font-size: 10px; opacity: 0.65; z-index: 1000;">

    </div>
</body>
</html>
